<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usher</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }
    h1 {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #ffffff;
    }
    p {
      font-size: 1.25rem;
      color: #888;
      letter-spacing: 0.02em;
    }
    a {
      margin-top: 1rem;
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #3b82f6;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    a:hover { background: #2563eb; }
  </style>
</head>
<body>
  <h1>Usher</h1>
  <p>Your app, in the dark.</p>
  <a href="demo/broken/index.html">Open demo shop &rarr;</a>
</body>
</html>
